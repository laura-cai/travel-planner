<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#254d43"><title>旅行计划</title><link rel="icon" href="./favicon.svg"><link rel="stylesheet" href="./style.css"></head><body>
<main><div hidden><span id="sync-state"></span><input id="travelers" value="2"><select id="display-currency"><option>USD</option><option>CNY</option><option>CLP</option></select><select id="sort"><option value="manual">默认</option></select><div id="summary"></div><span id="count"></span></div><div id="notice" role="status"></div><div id="plans"></div><button data-action="new">＋ 新增 Plan</button></main><dialog id="editor"><form id="edit-form"><div class="modal-head"><div><p class="eyebrow">MAKE IT OURS</p><h2 id="editor-title">编辑方案</h2></div><button type="button" class="icon" data-action="close">×</button></div><div class="form-grid"><label>方案名称<input name="title" required maxlength="160"></label><input name="tag" type="hidden"></div><div class="leg-head"><h3>航段</h3><button type="button" data-action="add-leg">＋ 添加航段</button></div><div id="leg-forms"></div><textarea name="note" hidden></textarea><div class="modal-foot"><button type="button" data-action="close">取消</button><button class="primary" type="submit">保存方案</button></div></form></dialog>
<dialog id="settings"><div class="modal-head"><div><p class="eyebrow">OUR SHARED SPACE</p><h2>共享与云端同步</h2></div><button class="icon" data-action="close">×</button></div><p>不需要任何账号登录。连接你自己的 Supabase 后，把共享链接发给对方，就能编辑同一份看板。</p><div class="callout">当前默认仅保存在这台浏览器。云端未配置前，分享网址不会同步数据。配置步骤见项目 README。</div><form id="sync-form"><label>你的名字<input name="name" required maxlength="60" placeholder="例如 Laura"></label><label>Supabase 项目 URL<input name="url" type="url" required placeholder="https://xxxx.supabase.co"></label><label>Publishable key / anon public key<input name="key" required placeholder="只填写公开密钥，不要填 service_role"></label><label>共享空间密钥<input name="room" required minlength="32" maxlength="128" placeholder="创建新空间时自动生成"></label><p class="muted">已有云端计划会优先载入；新空间会上传当前看板。共享链接包含编辑密钥，持有链接的人都可以查看和修改。</p><div class="modal-foot"><button type="button" data-action="disconnect">断开连接</button><button type="submit" class="primary">连接并同步看板</button></div></form><div class="share-row"><button data-action="share">复制共享链接</button><button data-action="reload-cloud">载入云端最新版本</button></div></dialog>
<dialog id="rates"><div class="modal-head"><h2>预算与汇率</h2><button class="icon" data-action="close">×</button></div><p>手动估算汇率，不会自动更新。所有方案统一使用以下汇率；报价币种仍保留原值。</p><form id="rates-form"><label>1 美元 = 多少智利比索<input name="clp" type="number" min="1" step="0.0001" required></label><label>1 美元 = 多少人民币<input name="cny" type="number" min="0.01" step="0.0001" required></label><div class="modal-foot"><button type="submit" class="primary">保存汇率</button></div></form></dialog>
<input type="file" id="import-file" accept="application/json,.json" hidden><div id="toast" role="status"></div><script src="./config.js"></script><script type="module" src="./app.js?v=20261024-5"></script></body></html>
